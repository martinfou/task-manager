name: MCP project management CI

on:
  push:
    branches: [main]
    paths:
      - 'mcp-project-management/**'
      - '.github/workflows/mcp-project-management-ci.yml'
  pull_request:
    paths:
      - 'mcp-project-management/**'
      - '.github/workflows/mcp-project-management-ci.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-project-management
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and dev deps
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v
